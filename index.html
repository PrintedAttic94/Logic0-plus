<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic0+</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <h1>Logic0+</h1>
        </div>
        <div class="header-actions">
          <button id="resetButton" class="secondary">重置</button>
          <button id="stepButton">单步运行</button>
          <button id="runButton" class="primary">开始运行</button>
        </div>
      </header>

      <section class="status-bar" aria-live="polite">
        <div id="levelStatus"><span>当前关卡</span><strong id="levelName">0-1 · 规则训练</strong></div>
        <div><span>状态</span><strong id="statusText">准备就绪</strong></div>
        <div><span>步数</span><strong id="stepCount">0</strong></div>
        <div><span>执行机器人</span><strong id="executionState">(2, 14) · ↑</strong></div>
        <div><span>指令栈</span><strong id="cloneCount">0</strong></div>
      </section>

      <section class="worlds">
        <article class="world-card instruction-card">
          <h2>指令模块</h2>
          <div class="instruction-stage" aria-label="指令模块">
            <div id="instructionEntry" class="instruction-entry"></div>
            <div class="grid-wrap"><div id="instructionGrid" class="grid instruction-grid"></div></div>
          </div>
        </article>

        <article class="world-card execution-card">
          <h2>执行模块</h2>
          <p id="executionDescription" class="world-description"></p>
          <div class="grid-wrap execution-wrap"><div id="executionGrid" class="grid execution-grid" aria-label="执行模块"></div></div>
        </article>
      </section>

      <section class="toolbox">
        <div class="toolbox-heading"><h2>地板工具</h2><p id="editHint"></p></div>
        <div id="palette" class="palette"></div>
      </section>

      <section class="save-panel">
        <div class="save-title"><h2 id="saveTitle">游玩进度</h2></div>
        <div id="saveControls" class="save-controls"></div>
        <p id="saveNotice" class="save-notice" aria-live="polite"></p>
      </section>

      <section class="event-panel">
        <ol id="eventLog"><li>等待第一条指令。</li></ol>
      </section>

      <dialog id="levelDialog" class="level-dialog">
        <div class="level-dialog-heading"><div><h2>读取关卡</h2></div><button id="closeLevelDialog" class="secondary">关闭</button></div>
        <div id="levelList" class="level-list"></div>
      </dialog>
    </main>
    <template id="tileTemplate"><button class="tile" type="button"></button></template>
    <script type="module" src="app.js"></script>
  </body>
</html>
